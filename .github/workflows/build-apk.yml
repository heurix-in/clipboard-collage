name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Add the app's native code and icons
        run: |
          mkdir -p android/app/src/main/java/com/clipcollage/app
          cp native/java/*.java android/app/src/main/java/com/clipcollage/app/
          mkdir -p android/app/src/main/res/xml
          cp native/res/xml/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          cp -r native/res/mipmap-* android/app/src/main/res/
          sed -i -E 's/>#[0-9A-Fa-f]{6,8}</>#2B54E0</' android/app/src/main/res/values/ic_launcher_background.xml || true

      - name: Copy the web app in
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Clipboard-Collage.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Clipboard-Collage-apk
          path: Clipboard-Collage.apk
