name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Add the app's native code and icons
        run: |
          mkdir -p android/app/src/main/java/com/clipcollage/app
          cp native/java/*.java android/app/src/main/java/com/clipcollage/app/
          mkdir -p android/app/src/main/res/xml
          cp native/res/xml/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          cp -r native/res/mipmap-* android/app/src/main/res/
          sed -i -E 's/>#[0-9A-Fa-f]{6,8}</>#2B54E0</' android/app/src/main/res/values/ic_launcher_background.xml || true
          find android/app/src/main/res -name 'splash.png' -exec cp native/splash.png {} \;

      - name: Use the fixed signing key and a rising version number
        run: |
          mkdir -p ~/.android
          cp native/debug.keystore ~/.android/debug.keystore
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E 's/versionName "[^"]*"/versionName "1.${{ github.run_number }}"/' android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          g = open(p).read()
          g = re.sub(r'(\nandroid \{)', r"\1\n    signingConfigs {\n        fixed {\n            storeFile file('../../native/debug.keystore')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }", g, count=1)
          g = re.sub(r'(\n\s*buildTypes \{)', r"\1\n        debug {\n            signingConfig signingConfigs.fixed\n        }", g, count=1)
          assert 'signingConfigs.fixed' in g and 'storeFile file' in g
          open(p, 'w').write(g)
          PY

      - name: Copy the web app in
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Clipboard-Collage.apk

      - name: Check the APK is signed with the fixed key
        run: |
          A=$(unzip -p Clipboard-Collage.apk META-INF/CERT.RSA | keytool -printcert | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')
          B=$(keytool -list -keystore native/debug.keystore -storepass android | grep -i 'SHA-256' | sed 's/.*: //')
          echo "APK:      $A"
          echo "Keystore: $B"
          test -n "$A" && test "$A" = "$B"

      - uses: actions/upload-artifact@v4
        with:
          name: Clipboard-Collage-apk
          path: Clipboard-Collage.apk

      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Clipboard-Collage.apk \
            --title "Clipboard Collage build ${{ github.run_number }}" \
            --notes "Download Clipboard-Collage.apk below and open it on your phone to install."
